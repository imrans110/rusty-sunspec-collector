[discovery]
subnet = "192.168.1.0/24"
port = 502
max_concurrency = 64
per_host_timeout_ms = 200
unit_ids = [1]                    # Modbus Unit IDs to scan per host (useful for gateways)
rescan_interval_s = 600           # subnet mode: rescan this often to find new devices

[[discovery.static_devices]]
ip = "192.168.1.20"
unit_id = 1
# Per-device settings (see "Per-device settings" in docs/configuration.md):
# poll_interval_ms = 5000
# request_timeout_ms = 2000
# base_address = 40000
# max_batch_size = 60
# include_models = [1, 103, 160]
# exclude_models = [123]
# model_intervals_s = { 160 = 10 }   # merged with [poller.model_intervals_s]

[poller]
poll_interval_ms = 1000
request_timeout_ms = 1000
jitter_ms = 0                     # max random offset of each device's polling schedule
# stall_timeout_ms = 30000         # restart a device with no successful read for this long
                                  # (default: max(10 x poll_interval, 30 s))
# include_models = [1, 103, 160]   # poll only these models (default: every discovered model)
# exclude_models = [123]           # never poll these models

# Models that rarely change, read at most this often instead of every cycle
# (model ID = seconds): common, nameplate and settings. Remove to read them every cycle.
[poller.model_intervals_s]
1 = 3600
120 = 3600
121 = 600

[modbus]
max_batch_size = 64             # capped at 125 (Modbus protocol limit)
retry_count = 2
retry_backoff_ms = 100
retry_max_backoff_ms = 2000
inter_read_delay_ms = 5

[sunspec]
base_address = 40000              # preferred base; 40000, 0 and 50000 are also probed

[buffer]
path = "sunspec-buffer.sqlite"
batch_size = 100
drain_interval_ms = 500         # pause between drains once the backlog is empty
max_rows = 1000000              # drop oldest rows beyond this during long outages
max_age_s = 604800              # drop rows older than 7 days during long outages
shutdown_drain_timeout_ms = 5000  # keep draining this long on stop (0 = stop at once)

[kafka]
brokers = "localhost:9092"
topic = "sunspec.telemetry"
client_id = "sunspec-collector"
acks = "all"
compression = "zstd"
timeout_ms = 5000
enable_idempotence = true
# Connection security (see docs/configuration.md). Example: SCRAM over TLS.
# security_protocol = "sasl_ssl"          # plaintext, ssl, sasl_plaintext, sasl_ssl
# ssl_ca_location = "/etc/sunspec-collector/kafka-ca.pem"
# sasl_mechanism = "SCRAM-SHA-512"        # PLAIN, SCRAM-SHA-256, SCRAM-SHA-512
# sasl_username = "site-0042"
# sasl_password_file = "/run/credentials/sunspec-collector.service/kafka-password"
# Mutual TLS instead: security_protocol = "ssl" plus ssl_certificate_location and ssl_key_location.

[metrics]
port = 9090                     # serves /metrics (Prometheus) and /healthz

[runtime]
channel_capacity = 256          # samples queued between pollers and the buffer
respawn_delay_ms = 1000         # base backoff before retrying a failed device
