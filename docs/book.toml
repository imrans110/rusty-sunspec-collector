[book]
authors = ["Imran S."]
language = "en"

src = "."
title = "Rusty SunSpec Collector"

[output.html]
git-repository-url = "https://github.com/imrans110/rusty-sunspec-collector"
site-url = "/rusty-sunspec-collector/"
# Light by default; readers whose system is set to dark get ayu.
default-theme = "light"
preferred-dark-theme = "ayu"
edit-url-template = "https://github.com/imrans110/rusty-sunspec-collector/edit/main/docs/{path}"
# Renders ```mermaid blocks (the architecture diagram); see the file.
additional-js = ["mermaid-init.js"]

[output.html.search]
enable = true
limit_results = 30
teaser_word_count = 30
use_boolean_and = true
boost_title = 2
boost_hierarchy = 1
boost_paragraph = 1
expand = true
heading_split = false

[output.html.fold]
enable = true
level = 0

# Pages that moved when the docs were reorganized by task.
[output.html.redirect]
"/ops.html" = "getting-started/deployment.html"

# Checks every internal link and #anchor at build time (CI installs mdbook-linkcheck; a local
# build without it skips the check). With two outputs the site is written to book/html.
[output.linkcheck]
optional = true
follow-web-links = false
