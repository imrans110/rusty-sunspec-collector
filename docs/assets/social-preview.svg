<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- GitHub social preview and README banner (docs/assets/social-preview.png, 1280x640).
       Render with a browser or Quick Look at 1280x640 and keep the PNG under 1 MB. -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FAF8F3" stop-opacity="1"/>
      <stop offset="1" stop-color="#FAF8F3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cells" width="64" height="40" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="60" height="36" rx="3" fill="none" stroke="#D9DEE6" stroke-width="1.5"/>
      <line x1="32" y1="2" x2="32" y2="38" stroke="#E6EAF0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#FAF8F3"/>
  <rect x="560" y="0" width="720" height="640" fill="url(#cells)"/>
  <rect x="560" y="0" width="420" height="640" fill="url(#fade)"/>
  <rect x="0" y="0" width="1280" height="8" fill="#F59E0B"/>

  <g transform="translate(108 196)">
    <circle r="26" fill="#F59E0B"/>
    <g stroke="#F59E0B" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-38" x2="0" y2="-48"/><line x1="0" y1="38" x2="0" y2="48"/>
      <line x1="-38" y1="0" x2="-48" y2="0"/><line x1="38" y1="0" x2="48" y2="0"/>
      <line x1="27" y1="27" x2="34" y2="34"/><line x1="-27" y1="-27" x2="-34" y2="-34"/>
      <line x1="27" y1="-27" x2="34" y2="-34"/><line x1="-27" y1="27" x2="-34" y2="34"/>
    </g>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="310" font-size="72" font-weight="800" fill="#0F172A" letter-spacing="-1.5">rusty-sunspec-</text>
    <text x="80" y="392" font-size="72" font-weight="800" fill="#0F172A" letter-spacing="-1.5">collector</text>
    <text x="80" y="452" font-size="28" fill="#475569">SunSpec telemetry from inverters, meters and</text>
    <text x="80" y="490" font-size="28" fill="#475569">batteries, decoded at the edge and sent to Kafka.</text>
    <text x="80" y="574" font-size="21" font-weight="600" fill="#B45309">112 SunSpec models  ·  At-least-once delivery  ·  x86_64, ARM, Docker</text>
  </g>
</svg>
