# Local stack: Kafka, two simulated inverters behind one gateway, the collector and
# Prometheus. Start with `docker compose up --build`, then:
#   curl localhost:9090/healthz
#   open http://localhost:9091 (Prometheus)
#   consume from the host at localhost:29092, topic sunspec.telemetry

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    volumes:
      - kafka-data:/var/lib/kafka/data

  simulator:
    image: sunspec-simulator:local
    build:
      context: .
      target: simulator
    command: ["--bind", "0.0.0.0:1502", "--units", "1,2"]

  collector:
    image: sunspec-collector:local
    build:
      context: .
      target: collector
    ports:
      - "9090:9090"
    environment:
      SUNSPEC_STATIC_DEVICES: simulator:1,simulator:2
      SUNSPEC_PORT: "1502"
      SUNSPEC_KAFKA_BROKERS: kafka:9092
      SUNSPEC_KAFKA_TOPIC: sunspec.telemetry
      SUNSPEC_METRICS_PORT: "9090"
      RUST_LOG: info
    volumes:
      - collector-data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      simulator:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - collector

volumes:
  kafka-data:
  collector-data:
