[package]
name = "collector-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SunSpec solar inverter telemetry collector"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
axum = "0.8"
metrics = "0.22"
# Only the recorder: /metrics is served by our own axum server, so the HTTP listener and
# push gateway (hyper, native-tls, openssl) are left out.
metrics-exporter-prometheus = { version = "0.18", default-features = false }

modbus-client = { path = "../modbus-client" }
sunspec-parser = { path = "../sunspec-parser" }
poller-actor = { path = "../poller-actor" }
avro-kafka = { path = "../avro-kafka" }
discovery = { path = "../discovery" }
buffer = { path = "../buffer" }
types = { path = "../types" }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.4"

[features]
# Statically link a vendored OpenSSL (portable ARM binaries; see docs/build.md).
vendored-openssl = ["avro-kafka/vendored-openssl"]

[dev-dependencies]
sunspec-sim = { path = "../sunspec-sim" }
