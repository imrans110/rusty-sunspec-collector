[package]
name = "collector-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SunSpec solar inverter telemetry collector"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
axum = "0.8"
metrics = "0.24"
# Only the recorder: /metrics is served by our own axum server, so the HTTP listener and
# push gateway (hyper, native-tls, openssl) are left out.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# Read-only MCP server (--mcp): the official Rust SDK over stdio, and a plain HTTP/1 client
# (hyper, already used by axum) for the collector's own endpoints.
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

modbus-client = { path = "../modbus-client" }
sunspec-parser = { path = "../sunspec-parser" }
poller-actor = { path = "../poller-actor" }
avro-kafka = { path = "../avro-kafka" }
discovery = { path = "../discovery" }
buffer = { path = "../buffer" }
types = { path = "../types" }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.5"

[features]
# Statically link a vendored OpenSSL (portable ARM binaries; see docs/build.md).
vendored-openssl = ["avro-kafka/vendored-openssl"]

[dev-dependencies]
sunspec-sim = { path = "../sunspec-sim" }
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-io"] }
