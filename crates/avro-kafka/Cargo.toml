[package]
name = "avro-kafka"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Avro OCF serialization with Kafka producer"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
apache-avro = "0.21"
rdkafka = { version = "0.39", features = ["cmake-build", "ssl", "tokio", "zstd"] }

types = { path = "../types" }

[features]
# Build OpenSSL from source and link it statically (used for cross-compiled binaries).
vendored-openssl = ["rdkafka/ssl-vendored"]

[dev-dependencies]
tokio = { workspace = true }
apache-avro = "0.21"
serde_json = "1.0"
