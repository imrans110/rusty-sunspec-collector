name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like the collector to do. Config or record-format sketches are welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Device support (models, vendors, transports)
        - Polling and discovery
        - Kafka records and delivery
        - Deployment (Docker, systemd, releases)
        - Monitoring (metrics, health, logs)
        - Documentation
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other tools you have considered.
