version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - ci
    open-pull-requests-limit: 3

  # Base images in the Dockerfiles, pinned by digest: digest updates for the same tag. The
  # builder stays on the MSRV (rust:1.88), so Rust version bumps are left to a deliberate change.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    labels:
      - ci
    ignore:
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    open-pull-requests-limit: 3
