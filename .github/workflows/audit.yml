name: Security Audit (daily)

# RustSec advisories are published for dependencies that have not changed, so the
# dependency audit also runs daily on main, not only when a PR changes Cargo.lock.
# A failed scheduled run is emailed to whoever last changed this schedule.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit

      - name: Run audit
        run: cargo audit
