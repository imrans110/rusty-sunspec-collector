name: Security Audit (daily)

# RustSec advisories are published for dependencies that have not changed, so the
# dependency audit also runs daily on main, not only when a PR changes Cargo.lock.
# A failed scheduled run is emailed to whoever last changed this schedule.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit

      - name: Run audit
        run: cargo audit
