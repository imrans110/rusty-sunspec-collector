name: Fuzzing

# ClusterFuzzLite builds the cargo-fuzz targets in fuzz/ with AddressSanitizer and runs them:
# for two minutes on pull requests that change the fuzzed code or the fuzzing setup, and for half
# an hour every week (which also covers dependency updates), keeping the corpus between runs as
# workflow artifacts. A crash fails the run and is uploaded as an artifact with a reproducer. See
# docs/contributing/fuzzing.md.
on:
  pull_request:
    paths:
      - "crates/sunspec-parser/**"            # decode_model, and decoding in model_chain
      - "crates/poller-actor/**"              # model_chain: discover_models
      - "crates/collector-app/src/config.rs"  # config
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Reads the corpus and coverage that earlier runs kept as artifacts.
      actions: read
    env:
      MODE: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
      SECONDS_TOTAL: ${{ github.event_name == 'pull_request' && 120 || 1800 }}
    steps:
      - name: Build the fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address

      - name: Run the fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
          mode: ${{ env.MODE }}
          fuzz-seconds: ${{ env.SECONDS_TOTAL }}
