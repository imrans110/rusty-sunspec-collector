name: CI

# Runs on every change: these checks are required for merging into main, and a
# required check that a workflow-level path filter skips never reports, which blocks the
# PR forever. Instead, the Changes job looks at what a PR touches, and the jobs below
# are skipped with `if:` when it touches no code; GitHub counts a skipped job as passing.
# Pushes to main always run everything.
on:
  push:
    branches: ["main"]
  pull_request:

# A new push to a PR cancels the run it supersedes; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "not a pull request: run everything"
            { echo "code=true"; echo "deps=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          deps=false
          while IFS= read -r file; do
            echo "changed: $file"
            case "$file" in
              # Anything compiled, tested or built into images. The three docs files
              # are read by tests (config examples and the shipped config and env file).
              crates/* | Cargo.toml | Cargo.lock | rustfmt.toml | Cross.toml | \
              Dockerfile | .dockerignore | docker/* | docker-compose.yml | fixtures/* | \
              .github/workflows/ci.yml | \
              docs/configuration.md | docs/config.example.toml | docs/sunspec-collector.env)
                code=true ;;
            esac
            case "$file" in
              Cargo.toml | Cargo.lock | crates/*/Cargo.toml | .github/workflows/ci.yml) deps=true ;;
            esac
          done <<< "$(git diff --name-only "$BASE" HEAD)"
          echo "code=$code, deps=$deps"
          { echo "code=$code"; echo "deps=$deps"; } >> "$GITHUB_OUTPUT"

  check:
    name: Check & Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace

      - name: Build
        run: cargo build --workspace

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests
        run: cargo test --workspace

  # Advisories also appear for unchanged dependencies; audit.yml checks main daily.
  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit

      - name: Run audit
        run: cargo audit

  docker-e2e:
    name: Docker E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build simulator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: simulator
          tags: sunspec-simulator:local
          load: true
          cache-from: type=gha,scope=collector-images
          cache-to: type=gha,mode=max,scope=collector-images

      - name: Build collector image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: collector
          tags: sunspec-collector:local
          load: true
          cache-from: type=gha,scope=collector-images

      - name: Start Kafka, simulator and collector
        run: docker compose up -d --no-build kafka simulator collector

      - name: Wait for the collector to be healthy
        run: |
          for _ in $(seq 1 90); do
            if curl -fsS localhost:9090/healthz; then echo; exit 0; fi
            sleep 2
          done
          echo "collector never became healthy"; exit 1

      - name: Wait for records to reach Kafka
        run: |
          for _ in $(seq 1 60); do
            sent=$(curl -fsS localhost:9090/metrics | awk '/^sunspec_uplink_records_total /{print int($2)}')
            if [ "${sent:-0}" -gt 0 ]; then echo "records acknowledged by Kafka: $sent"; exit 0; fi
            sleep 2
          done
          echo "no records were published"; exit 1

      - name: Records are keyed per device
        run: |
          docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic sunspec.telemetry --from-beginning \
            --max-messages 40 --timeout-ms 30000 \
            --property print.key=true --property print.value=false > keys.txt || true
          sort -u keys.txt
          grep -qx 'simulator/1' keys.txt
          grep -qx 'simulator/2' keys.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Decode published records and run the Kafka integration tests
        env:
          SUNSPEC_KAFKA_BROKERS: localhost:29092
        run: cargo test -p avro-kafka --test kafka_integration_tests -- --ignored --nocapture

      - name: Stop on SIGTERM with a clean exit
        run: |
          docker compose stop --timeout 30 collector
          docker compose logs --no-color collector | tail -n 20
          docker compose logs --no-color collector | grep -q "collector stopped"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq collector)")" = "0"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
