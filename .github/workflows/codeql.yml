name: CodeQL

# Static analysis of the Rust code and of these workflows. Findings go to the repository's
# Security tab; on a pull request, the CodeQL check lists the alerts the PR adds. Pull requests
# run it when they change code or workflows; main is analyzed on every push and weekly.
on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "crates/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Rust extractor runs build scripts; librdkafka's needs cmake and these headers.
      - name: Install build dependencies
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev pkg-config

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
