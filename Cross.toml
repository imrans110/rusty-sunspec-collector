# Release builds (`cross build --target <target>`) use the images from
# docker/Dockerfile.cross, which must be built locally under these tags first; see
# docs/build.md.
[target.x86_64-unknown-linux-gnu]
image = "sunspec-cross-x86_64-unknown-linux-gnu"

[target.aarch64-unknown-linux-gnu]
image = "sunspec-cross-aarch64-unknown-linux-gnu"
