[workspace]
members = [
    "crates/collector-app",
    "crates/modbus-client",
    "crates/sunspec-parser",
    "crates/poller-actor",
    "crates/avro-kafka",
    "crates/discovery",
    "crates/buffer",
    "crates/types",
    "crates/sunspec-sim",
]
# Resolver 3 is resolver 2 plus MSRV-aware resolution: `cargo update` (and Dependabot) prefer
# dependency versions whose rust-version fits ours (1.88), so the lockfile stays buildable on it.
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/imrans110/rusty-sunspec-collector"
homepage = "https://github.com/imrans110/rusty-sunspec-collector"
authors = ["Imran S."]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync", "signal"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "rtu"] }
tracing = "0.1"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
