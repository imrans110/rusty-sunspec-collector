[workspace]
members = [
    "crates/collector-app",
    "crates/modbus-client",
    "crates/sunspec-parser",
    "crates/poller-actor",
    "crates/avro-kafka",
    "crates/discovery",
    "crates/buffer",
    "crates/types",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/imrans110/rusty-sunspec-collector"
homepage = "https://github.com/imrans110/rusty-sunspec-collector"
authors = ["Imran S."]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync", "signal"] }
tokio-modbus = "0.9"
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
